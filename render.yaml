# =============================================================================
# GitWatch — n8n sur Render
#
# Adapté du template Render de base vers le brief GitWatch :
#   - stockage n8n dans SUPABASE (schéma `n8n`, rôle `n8n_user`), pas de Postgres Render
#   - version d'image fixée (pas `latest`)
#   - timezone Europe/Paris, WEBHOOK_URL explicite
#
# Les secrets ne sont PAS dans ce fichier (sync: false) :
# à saisir dans le Dashboard Render (Environment) après le déploiement.
# Brief de référence : BRIEF-render-n8n-gateway.md
# =============================================================================

services:
  - type: web
    name: gitwatch-n8n
    runtime: image
    plan: free                # pour tester ; passer en starter pour la prod
                              # (le plan free s'endort après 15 min d'inactivité)
    image:
      # Version fixée (jamais latest) — stable au 17/11/2026.
      # Vérifier la dernière stable avant upgrade :
      # https://github.com/n8n-io/n8n/releases
      url: docker.io/n8nio/n8n:2.45.7

    envVars:
      # Clé de chiffrement des credentials n8n.
      # Générée une seule fois : la COPIER et la sauvegarder tout de suite
      # (Render > gitwatch-n8n > Environment). Ne jamais la régénérer :
      # les identifiants enregistrés dans n8n deviendraient illisibles.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # --- Base de données : Supabase, session pooler ------------------------
      # Project ref : svzsuxncspozihxcipnc (région eu-central-1)
      # Host/user non sensibles ; seul le mot de passe reste à saisir
      # dans le Dashboard Render (sync: false).
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: n8n_user.svzsuxncspozihxcipnc
      - key: DB_POSTGRESDB_PASSWORD
        sync: false           # mot de passe de n8n_user (défini par Jade)
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      # "true" si vous fournissez aussi DB_POSTGRESDB_SSL_CA (CA Supabase).
      # "false" accepte le certificat du pooler sans le valider (débride le setup).
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # --- Divers -------------------------------------------------------------
      # L'URL est déduite du nom du service ci-dessus.
      - key: WEBHOOK_URL
        value: https://gitwatch-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: Europe/Paris
      - key: TZ
        value: Europe/Paris

    # Optionnel en plan payant : disque persistant pour la config et les
    # fichiers binaires de n8n (les workflows sont dans Supabase).
    # disks:
    #   - name: n8n-data
    #     mountPath: /home/node/.n8n
    #     sizeGB: 5
